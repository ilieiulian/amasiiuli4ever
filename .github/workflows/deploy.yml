name: Publicare automata

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: productie
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build si publicare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: productie

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v6

      - name: Configureaza Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Instaleaza dependentele
        run: npm ci

      - name: Verifica si construieste site-ul
        run: npm run build

      - name: Pregateste stocarea imaginilor
        run: |
          npx wrangler r2 bucket list > r2-buckets.txt
          if ! grep -q "amasiiuli4ever-drawings" r2-buckets.txt; then
            npx wrangler r2 bucket create amasiiuli4ever-drawings
          fi
          node scripts/configure-cloudflare-r2.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publica pe Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
